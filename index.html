<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RU IFTO - Restaurante Universitário</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="assets/icons/site.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Navbar -->
        <nav class="navbar" id="navbar">
            <div class="container">
                <div class="navbar-content">
                    <div class="navbar-brand">
                        <img src="img/logo_branco.png" alt="RU IFTO" class="navbar-logo">
                        <span>RU IFTO</span>
                    </div>
                    <div class="navbar-links" id="navLinks">
                        <!-- Links serão injetados pelo JS -->
                    </div>
                </div>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <main class="main-content" id="mainContent">
            <!-- O conteúdo será renderizado pelo JS -->
        </main>

        <footer class="footer">
            <div class="container">
                <p>&copy; 2026 RU IFTO - Restaurante Universitário do Instituto Federal do Tocantins</p>
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div class="modal" id="modal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content" id="modalContent">
            <!-- Conteúdo do modal será injetado -->
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
